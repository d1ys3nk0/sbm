---

name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go mod tidy -diff
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Cross-build macOS architectures
        run: |
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/sbm-$arch" ./cmd/sbm
          done
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.0 git --redact --no-banner .
  packaging:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean
      - name: Verify snapshot archives and executable metadata
        run: python3 scripts/check-release.py
